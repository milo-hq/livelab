# SRS 6 minimal config: RTMP ingest + HTTP-FLV egress (HLS disabled; MediaMTX serves LL-HLS)
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # keep GOP cache so a new HTTP-FLV viewer starts from the last keyframe (fast startup)
    play {
        gop_cache       on;
        gop_cache_max_frames 2500;
        queue_length    10;
        mw_latency      100;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled     off;
    }
}
